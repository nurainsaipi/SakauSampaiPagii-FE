<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <title>Meja belajar</title>
  <!-- Table top surface -->
  <rect x="4" y="16" width="40" height="6" rx="3" fill="#785A00"/>
  <!-- Table top highlight -->
