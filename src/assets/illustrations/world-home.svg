<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
  <title>Dunia Rumah</title>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="#EAF5EC"/>
  <!-- House body -->
  <rect x="22" y="40" width="36" height="24" rx="3" fill="#ffffff" stroke="#2A4A38" stroke-width="2.5"/>
  <!-- Roof -->
  <polygon points="40,16 18,42 62,42" fill="#2A4A38"/>
  <!-- Door -->
  <rect x="34" y="50" width="12" height="14" rx="2" fill="#FDCB57" stroke="#785A00" stroke-width="1.5"/>
  <!-- Door knob -->
  <circle cx="43" cy="58" r="1.5" fill="#785A00"/>
  <!-- Window left -->
  <rect x="24" y="47" width="8" height="7" rx="1.5" fill="#C1E8FF" stroke="#2A4A38" stroke-width="1.5"/>
  <!-- Window right -->
  <rect x="48" y="47" width="8" height="7" rx="1.5" fill="#C1E8FF" stroke="#2A4A38" stroke-width="1.5"/>
  <!-- Chimney -->
  <rect x="51" y="22" width="6" height="12" rx="1.5" fill="#2A4A38"/>
  <!-- Chimney smoke -->
  <path d="M54 20 Q56 15 54 10" stroke="#C1C8C1" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
