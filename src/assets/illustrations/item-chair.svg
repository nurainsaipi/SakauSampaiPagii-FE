<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <title>Kursi</title>
  <!-- Seat -->
  <rect x="8" y="20" width="32" height="6" rx="3" fill="#2A4A38"/>
  <!-- Seat cushion -->
  <rect x="10" y="20" width="28" height="4" rx="2" fill="#41624F"/>
  <!-- Backrest -->
  <rect x="8" y="8" width="32" height="14" rx="3" fill="#2A4A38"/>
  <!-- Backrest cushion -->
  <rect x="10" y="10" width="28" height="10" rx="2" fill="#41624F"/>
  <!-- Back stripe detail -->
  <line x1="20" y1="10" x2="20" y2="20" stroke="#C6EBD3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="10" x2="28" y2="20" stroke="#C6EBD3" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Front legs -->
  <rect x="10" y="26" width="5" height="18" rx="2.5" fill="#785A00"/>
  <rect x="33" y="26" width="5" height="18" rx="2.5" fill="#785A00"/>
  <!-- Back legs (shorter, angled feel) -->
  <rect x="10" y="6" width="4" height="4" rx="2" fill="#785A00"/>
  <rect x="34" y="6" width="4" height="4" rx="2" fill="#785A00"/>
  <!-- Foot rest bar -->
  <rect x="10" y="38" width="28" height="3" rx="1.5" fill="#A07820"/>
</svg>
