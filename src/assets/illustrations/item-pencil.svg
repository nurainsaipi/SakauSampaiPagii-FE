<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
  <title>Pensil</title>
  <!-- Pencil body -->
  <rect x="20" y="6" width="8" height="30" rx="2" fill="#FDCB57"/>
  <!-- Pencil stripe top -->
  <rect x="20" y="6" width="8" height="6" rx="2" fill="#C1C8C1"/>
  <!-- Eraser top -->
  <rect x="21" y="4" width="6" height="4" rx="1" fill="#FFDF9D"/>
  <!-- Pencil tip / point -->
  <path d="M20 36 L24 44 L28 36z" fill="#2A4A38"/>
  <path d="M22 36 L24 42 L26 36z" fill="#785A00"/>
  <!-- Wood tip -->
  <rect x="20" y="32" width="8" height="6" rx="1" fill="#F4E4C0"/>
  <!-- Pencil line detail -->
  <line x1="24" y1="8" x2="24" y2="34" stroke="#F0C04D" stroke-width="1" opacity="0.5"/>
</svg>
